<!DOCTYPE html>
<!--
  admin.html — Admin overview page

  WHO CAN SEE THIS:
    Only users with role = "admin"
    guardAdmin() in admin.js redirects anyone else back to login.html

  HOW IT WORKS:
    - admin.js runs on load → calls guardAdmin() → calls loadAllTodos()
    - loadAllTodos() → GET /api/todos/all (admin-only endpoint)
    - Backend populates userId → returns { userId: { name, email }, title, ... }
    - renderAdminStats() fills the 3 count boxes
    - renderAdminTable() builds a <tr> row for every todo from every user

  JS FILES LOADED:
    api.js   → all fetch helpers (guardAdmin, apiGetAllTodos, etc.)
    admin.js → loadAllTodos(), renderAdminStats(), renderAdminTable()
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App – Admin</title>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body>

  <!-- ── NAVBAR ─────────────────────────────────── -->
  <nav>
    <h2>🛠 Admin Panel</h2>
    <!-- logout() in api.js — clears localStorage → login.html -->
    <button class="nav-btn-logout" onclick="logout()">Logout</button>
  </nav>

  <div class="container">

    <!-- ── STATS — 3 boxes ───────────────────────────
         JS fills the numbers via id attributes.
         e.g. document.getElementById('stat-total').textContent = todos.length
    ──────────────────────────────────────────────── -->
    <div class="admin-stats">
      <div class="stat-box">
        <div class="num" id="stat-total">0</div>
        <div class="label">Total Todos (All Users)</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-completed">0</div>
        <div class="label">Completed</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-pending">0</div>
        <div class="label">Pending</div>
      </div>
    </div>

    <!-- ── TABLE ─────────────────────────────────────
         thead = column headers (static HTML)
         tbody = data rows (filled by renderAdminTable() in admin.js)
    ──────────────────────────────────────────────── -->
    <h3 class="section">All Todos Across All Users</h3>

    <table>
      <thead>
        <tr>
          <th>User Name</th>   <!-- todo.userId.name (populated from DB) -->
          <th>Email</th>        <!-- todo.userId.email -->
          <th>Todo Title</th>   <!-- todo.title -->
          <th>Priority</th>     <!-- todo.priority — shown as a colored badge -->
          <th>Status</th>       <!-- todo.status  — shown as a colored badge -->
          <th>Created</th>      <!-- todo.createdAt formatted as date string -->
        </tr>
      </thead>
      <tbody id="admin-tbody">
        <!-- Rows are added here by renderAdminTable() in admin.js -->
        <!-- Each row is built as: `<tr><td>...</td>...</tr>` -->
      </tbody>
    </table>

  </div><!-- end .container -->

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- api.js MUST load before admin.js -->
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
